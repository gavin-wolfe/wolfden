name: Settlement
plural: settlements
description: >-
  A place people live or work, whether on a world, orbiting it, floating in
  its atmosphere, or out on its own: a city, a colony, an orbital station, a
  fuel-mining platform.
kind_of: location
fields:
  part_of:
    type: ref
    to: [world, star-system, location]
    description: >-
      The world it's on, orbits, or floats in, or the star system if none of
      those.
  kind:
    type: text
    description: What sort of place it is, such as a colony or a relay station.
  population:
    type: text
    temporal: true
    description: >-
      How many live here, in the story's own terms, such as "a few thousand"
      or "abandoned".
  controlled_by:
    type: ref
    to: [polity, faction]
    temporal: true
    description: The polity or group that holds it.
sections:
  - name: Overview
    description: What the place is and why it matters, in a paragraph.
  - name: Description
    description: What it looks, sounds, and smells like.
  - name: Society
    description: Who lives here and how they get by.
  - name: History
    description: What happened here before and during the story.
template: settlement.md
