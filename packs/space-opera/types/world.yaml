name: World
plural: worlds
description: >-
  A planet, moon, asteroid, or gas giant: a body in space that people can
  live on, visit, or build around.
kind_of: location
fields:
  part_of:
    type: ref
    to: [star-system, world, location]
    description: The star system it's in, or the world a moon circles.
  kind:
    type: text
    description: >-
      What sort of world it is, such as an ocean planet, a moon, an asteroid,
      or a gas giant.
  population:
    type: text
    temporal: true
    description: >-
      How many live here, in the story's own terms, such as "about 40
      million" or "abandoned".
  controlled_by:
    type: ref
    to: [polity, faction]
    temporal: true
    description: The polity or group that holds it.
sections:
  - name: Overview
    description: What the world is and why it matters, in a paragraph.
  - name: Environment
    description: Its climate, gravity, air, and what it takes to live there.
  - name: Society
    description: Who lives here and how they get by.
  - name: History
    description: What happened here before and during the story.
template: world.md
